name: Checks

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  backend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: backend/requirements-lock.txt
      - run: python -m pip install -r backend/requirements-lock.txt
      - run: PYTHONPATH=backend python -m pytest backend/tests -q
        # Live tests explicitly skip without a key. CI does not spend the shared quota.
        env:
          VERSIONVERDICT_CACHE_DIR: ${{ runner.temp }}/versionverdict-cache
          RUN_LIVE_SERPAPI: '0'
  frontend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm --prefix frontend ci
      - run: npm --prefix frontend run build
